# This file is managed by hand (not PDK-synced) so the pipeline can cover
# puppet apply on Windows, REFERENCE.md freshness and Puppet 7/8 matrix testing.
name: CI

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 'Validate (PDK validate + REFERENCE.md)'
    runs-on: ubuntu-latest
    env:
      PUPPET_GEM_VERSION: '~> 8.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: PDK validate (syntax, lint, metadata, rubocop, YAML/JSON)
        run: bundle exec rake syntax lint metadata_lint rubocop
      - name: REFERENCE.md is up to date
        run: |
          bundle exec rake strings:generate:reference
          git diff --exit-code REFERENCE.md || \
            (echo '::error::REFERENCE.md is out of date. Run `bundle exec rake strings:generate:reference` and commit the result.' && exit 1)

  unit:
    name: 'Unit (Puppet ${{ matrix.puppet_version }}, Ruby ${{ matrix.ruby }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Puppet 8 is the primary target; Puppet 7 is kept for compatibility.
          - puppet_version: '~> 8.0'
            ruby: '3.2'
          - puppet_version: '~> 7.0'
            ruby: '2.7'
    env:
      PUPPET_GEM_VERSION: ${{ matrix.puppet_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run unit tests (pdk test unit equivalent)
        run: bundle exec rake parallel_spec
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-puppet-${{ matrix.puppet_version }}-ruby-${{ matrix.ruby }}
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  acceptance:
    name: 'Acceptance (puppet apply, Windows)'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Puppet agent
        shell: powershell
        run: |
          choco install puppet-agent -y --no-progress
          'C:\Program Files\Puppet Labs\Puppet\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check Puppet version
        shell: powershell
        run: puppet --version
      - name: Stage module into the agent modulepath
        # The repo root is the module; Puppet expects it under a directory
        # named after the module (`winget`, not `kfrlabs-winget`).
        shell: powershell
        run: |
          $ModuleDir = 'C:\ProgramData\PuppetLabs\puppet\etc\modules\winget'
          New-Item -ItemType Directory -Force -Path $ModuleDir | Out-Null
          Copy-Item -Path "$env:GITHUB_WORKSPACE\*" -Destination $ModuleDir -Recurse -Force -Exclude '.git'
          Get-ChildItem $ModuleDir | Select-Object Name
      - name: Write acceptance manifest
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path C:\Temp | Out-Null
          @"
          class { 'winget':
            ensure => present,
          }
          "@ | Set-Content -Encoding ascii C:\Temp\winget_acceptance.pp
          Get-Content C:\Temp\winget_acceptance.pp
      - name: Apply bootstrap (run 1, changes allowed)
        shell: powershell
        run: |
          puppet apply --detailed-exitcodes --modulepath 'C:\ProgramData\PuppetLabs\puppet\etc\modules' C:\Temp\winget_acceptance.pp
          $code = $LASTEXITCODE
          if ($code -eq 0 -or $code -eq 2) { exit 0 } else { exit $code }
      - name: Apply bootstrap again (run 2, must be idempotent)
        shell: powershell
        run: |
          puppet apply --detailed-exitcodes --modulepath 'C:\ProgramData\PuppetLabs\puppet\etc\modules' C:\Temp\winget_acceptance.pp
          $code = $LASTEXITCODE
          if ($code -eq 0) { exit 0 } else { Write-Error "Second apply exited with $code, expected 0 (idempotent)."; exit $code }
      - name: winget CLI is functional
        shell: powershell
        run: winget --version
      - name: Provider loads in noop (no changes made)
        # Compiles a catalog with a winget package and evaluates it noop:
        # proves the provider is suitable on the runner without installing
        # anything (query/latest are read-only under --noop).
        shell: powershell
        run: |
          @"
          class { 'winget':
            ensure => present,
          }
          package { 'Git.Git':
            ensure   => present,
            provider => winget,
          }
          Class['winget'] -> Package['Git.Git']
          "@ | Set-Content -Encoding ascii C:\Temp\winget_provider_noop.pp
          puppet apply --noop --modulepath 'C:\ProgramData\PuppetLabs\puppet\etc\modules' C:\Temp\winget_provider_noop.pp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build:
    name: 'Build module package (pdk build)'
    needs:
      - validate
      - unit
    runs-on: ubuntu-latest
    env:
      PUPPET_GEM_VERSION: '~> 8.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Install PDK
        # `pdk build` needs the `pdk` binary, which the runner image does not ship.
        run: |
          wget -q "https://apt.puppet.com/puppet-tools-release-$(lsb_release -cs).deb"
          sudo dpkg -i "puppet-tools-release-$(lsb_release -cs).deb"
          sudo apt-get update -qq
          sudo apt-get install -y -qq pdk
      - name: Build the module package, the way the Forge would
        run: pdk build
      - name: Upload module package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module-package
          path: pkg/*.tar.gz
          retention-days: 7

  gate:
    name: CI gate
    needs:
      - validate
      - unit
      - acceptance
      - build
    runs-on: ubuntu-latest
    steps:
      - run: echo 'All CI jobs passed.'
