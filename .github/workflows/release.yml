# Release pipeline: tag vX.Y.Z -> checks -> Forge publish -> GitHub Release.
name: Release to the Puppet Forge

on:
  push:
    tags:
      - 'v*.*.*'
  # Dry run (issue #42): validates everything a tag push would, without
  # publishing to the Forge or creating a GitHub release. Run it on a
  # throwaway version before cutting the real tag.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to validate (e.g. 1.1.0, without the v prefix)'
        required: true

permissions:
  contents: write

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUPPET_GEM_VERSION: '~> 8.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Syntax, lint, metadata, rubocop
        run: bundle exec rake syntax lint metadata_lint rubocop
      - name: Unit tests
        run: bundle exec rake parallel_spec

  release:
    name: Build, publish and release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUPPET_GEM_VERSION: '~> 8.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            version='${{ inputs.version }}'
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            echo '::error::Could not resolve a release version.'
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing version ${version}."
      - name: Tag must match metadata.json version
        # Skipped on dry runs: there is no tag, only the validated version.
        if: github.event_name != 'workflow_dispatch'
        run: |
          version='${{ steps.version.outputs.version }}'
          metadata_version="$(ruby -rjson -e "puts JSON.parse(File.read('metadata.json'))['version']")"
          if [ "$version" != "$metadata_version" ]; then
            echo "::error::Tag v${version} does not match metadata.json version ${metadata_version}."
            exit 1
          fi
      - name: Tagged commit must be reachable from main
        # Skipped on dry runs (no tag pushed): validates the real release only.
        if: github.event_name != 'workflow_dispatch'
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo '::error::Tag does not point at a commit reachable from main. Merge the release commit to main first.'
            exit 1
          fi
      - name: CHANGELOG must have an entry for the version
        # Runs BEFORE the Forge publish (issue #42): a missing entry used to
        # fail the job after an irreversible upload, leaving the Forge and
        # GitHub in different states.
        run: |
          version='${{ steps.version.outputs.version }}'
          python3 - "$version" <<'EOF'
          import re, sys
          version = sys.argv[1]
          text = open('CHANGELOG.md', encoding='utf-8').read()
          pattern = re.compile(
              r'^## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=^## \[|\Z)',
              re.M | re.S,
          )
          match = pattern.search(text)
          if not match or not match.group(1).strip():
              print(f'::error::No CHANGELOG entry found for version {version}.')
              sys.exit(1)
          open('/tmp/release_notes.md', 'w', encoding='utf-8').write(match.group(1).strip() + '\n')
          EOF
          cat /tmp/release_notes.md
      - name: Install PDK
        run: |
          wget -q "https://apt.puppet.com/puppet-tools-release-$(lsb_release -cs).deb"
          sudo dpkg -i "puppet-tools-release-$(lsb_release -cs).deb"
          sudo apt-get update -qq
          sudo apt-get install -y -qq pdk
      - name: Build the module package
        run: pdk build --force
      - name: Publish to the Puppet Forge
        # Skipped on dry runs (issue #42): validation only, no side effects.
        if: github.event_name != 'workflow_dispatch'
        env:
          FORGE_API_KEY: ${{ secrets.FORGE_API_KEY }}
        run: |
          if [ -z "${FORGE_API_KEY}" ]; then
            echo '::error::Missing FORGE_API_KEY secret.'
            exit 1
          fi
          archive="$(ls pkg/*.tar.gz | head -n 1)"
          echo "Uploading ${archive} to the Forge."
          http_code="$(curl -sS -o /tmp/forge_response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${FORGE_API_KEY}" \
            -F "file=@${archive}" \
            https://forgeapi.puppet.com/v3/releases)"
          cat /tmp/forge_response.json
          echo
          case "${http_code}" in
            200|201) echo 'Forge upload accepted.' ;;
            *) echo "::error::Forge upload failed (HTTP ${http_code})."; exit 1 ;;
          esac
      - name: Create GitHub Release
        # Skipped on dry runs (issue #42): validation only, no side effects.
        # Uses the preinstalled gh CLI instead of a third-party action
        # (the repo policy requires fully-pinned action SHAs).
        if: github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version='${{ steps.version.outputs.version }}'
          gh release create "v${version}" --title "v${version}" --notes-file /tmp/release_notes.md pkg/*.tar.gz
