---
version: 5

defaults: # Used for any hierarchy level that omits these keys.
  datadir: data # This path is relative to hiera.yaml's directory.
  data_hash: yaml_data # Use the built-in YAML backend.

# The module ships no per-OS data today (only data/common.yaml, an empty
# hash), so a single common level is enough. Per-OS levels were removed
# (issue #47): they pointed at files that do not exist and only added
# failed lookups.
hierarchy:
  - name: 'common'
    path: 'common.yaml'
